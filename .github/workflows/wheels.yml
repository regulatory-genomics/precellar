name: build-wheels
on:
  workflow_call

jobs:
  build_wheels:
    name: Wheel on ${{ matrix.os }} for ${{ matrix.python_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        #os: [ubuntu-latest, macos-13, macos-14]
        os: [ubuntu-latest]
        python_version: ["cp312-*", "cp313-*", "cp314-*"]
    env:
       CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
       CIBW_BUILD_VERBOSITY: 1
       CIBW_BEFORE_ALL_LINUX: >
         curl https://sh.rustup.rs -sSf | sh -s -- -y && yum install -y openssl-devel zlib-devel clang-devel

       CIBW_ARCHS_LINUX: "auto64"
       CIBW_ENVIRONMENT: 'PATH="$PATH:$HOME/.cargo/bin"'
       CIBW_SKIP: "pp* *-win32 *-musllinux*"
       CIBW_BUILD: ${{ matrix.python_version }}

    steps:
      - name: Checkout code
        uses: nschloe/action-cached-lfs-checkout@v1

      - uses: ./.github/actions/setup-rust

      # Used to host cibuildwheel
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.1.*

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Generate llms.txt
        run: uv run --group docs python scripts/generate_llms_txt.py --output snapatac2/llms.txt

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse .

      - name: Clean up generated llms.txt
        run: rm -f snapatac2/llms.txt

      - uses: actions/upload-artifact@v4
        with:
          name: precellar-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.14'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install maturin
        run: python -m pip install "maturin>=1.4,<2.0"

      - name: Build sdist
        run: bash scripts/build_dist.sh sdist
        working-directory: ./

      - uses: actions/upload-artifact@v4
        with:
          name: precellar-sdist
          path: target/wheels/*.tar.gz
