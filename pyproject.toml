[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "precellar"
authors = [
    {name = "Kai Zhang", email = "zhangkai33@westlake.edu.cn"}
]
description = "precellar: Single-cell epigenomics preprocessing toolkit"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
requires-python = ">=3.10, <3.15"
dependencies = ["pooch>=1, <2"]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"

[project.urls]
Homepage = "https://lab.kaizhang.org/precellar/"
Documentation = "https://lab.kaizhang.org/precellar/"
Repository = "https://github.com/regulatory-genomics/precellar"
Issues = "https://github.com/regulatory-genomics/precellar/issues"
Changelog = "https://lab.kaizhang.org/precellar/version/dev/changelog.html"

[dependency-groups]
dev = [
  {include-group = "test"},
]

# For integration-testing
test = [
  "pytest >=8.1.1,<9",
  "hypothesis >=6.72.4,<7",
]

docs = [
  "auto-api @ git+https://github.com/regulatory-genomics/auto-api@3ce76f37730e63d0259edf4e4f968d130f741385",
]